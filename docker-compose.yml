services:
  gametracker:
    build: .
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"   # run as your user so ./data stays editable without sudo
    # Only reachable from the server itself; `tailscale serve` publishes it to your tailnet.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
    environment:
      TZ: ${TZ:-Etc/UTC}   # set TZ in .env to your timezone (e.g. TZ=Europe/Berlin), so "today" and session days line up
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # or paste the key into Settings in the dashboard
      COACH_URL: http://coach:8790

  # The coach agent: prime-agent with its own persistent home (sessions, continual-learning memory,
  # Python kernel), separate from any prime-agent setup on the host. It sees a read-only snapshot of
  # the tracker database, never the settings file. Not published outside the compose network.
  coach:
    build: .
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["python", "-m", "gametracker", "coach-runner"]
    volumes:
      - ./data/coach-home:/prime-home
      - ./data/coach-workspace:/workspace
      - ./data/snapshot:/workspace/data:ro
      - ./data/frames:/workspace/frames:ro    # death frames from video evidence, for the coach to look at
      - ${PRIME_AGENT_DIR:-./prime-agent}:/opt/prime-agent:ro   # prime-agent install dir (set in .env)
    environment:
      TZ: ${TZ:-Etc/UTC}
      HOME: /prime-home
      COACH_WORKSPACE: /workspace
      PRIME_AGENT_BIN: /opt/prime-agent/bin/prime-agent
